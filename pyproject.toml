[project]
name = "k8s-capacity-planner"
version = "0.1.0"
description = "Plan the cheapest Kubernetes node fleet with 2-D bin packing, an exact solver and real EC2 prices"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1", "hypothesis==6.168.5", "ruff==0.17.0"]

[project.scripts]
capplan = "capplan.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["capplan"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["capplan.model.Resources"]   # frozen dataclass: safe as a default argument
